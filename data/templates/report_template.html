<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ResumeLens - Candidate Profile - $name</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            color: #222222;
            margin: 0;
            padding: 40px;
        }

        .candidate-card {
            max-width: 850px;
            margin: auto;
            background-color: white;
            border: 1px solid #cccccc;
            border-radius: 10px;
            padding: 30px;
        }

        .header {
            border-bottom: 2px solid #333333;
            margin-bottom: 25px;
        }

        .header h1 {
            margin-bottom: 5px;
        }

        .header p {
            margin-top: 0;
        }

        .section {
            margin-bottom: 25px;
        }

        .section h2 {
            border-bottom: 1px solid #dddddd;
            padding-bottom: 5px;
        }

        .skills {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .skill {
            background-color: #eeeeee;
            border-radius: 5px;
            padding: 8px 12px;
        }

        .skill small {
            color: #666666;
        }

        .evaluation {
            background-color: #eeeeee;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 15px;
        }

        .evaluation h3 {
            margin-top: 0;
        }

        .accepted {
            font-weight: bold;
            color: #1b6e2d;
        }

        .rejected {
            font-weight: bold;
            color: #a12622;
        }

        .metadata {
            font-size: 0.9em;
        }

        .empty {
            color: #666666;
            font-style: italic;
        }
    </style>
</head>

<body>

<div class="candidate-card">

    <!-- Candidate identification -->
    <div class="header">
        <h1>$name</h1>
        <p>Candidate Profile generated by ResumeLens</p>
    </div>

    <!-- Personal information -->
    <div class="section">
        <h2>Personal Information</h2>
$personal
    </div>

    <!-- Education -->
    <div class="section">
        <h2>Education</h2>
$education
    </div>

    <!-- Experience -->
    <div class="section">
        <h2>Experience</h2>
$experience
    </div>

    <!-- Skills after FST normalization -->
    <div class="section">
        <h2>Normalized Technical Skills</h2>
$skills
    </div>

    <!-- Results produced by the finite automata -->
    <div class="section">
        <h2>Qualification Evaluation</h2>
$evaluation
    </div>

</div>

</body>
</html>
